services:
  - type: web
    name: clearcut-background-remover-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_ORIGINS
        sync: false
      - key: REMBG_MODEL
        value: u2netp
      - key: MAX_PROCESSING_DIMENSION
        value: 1280
      - key: ENABLE_DECONTAMINATE
        value: false
      - key: MALLOC_ARENA_MAX
        value: 2
